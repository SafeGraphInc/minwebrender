# Three replicas, deliberately: the Render outage was a single-instance wedge,
# and MAX_PAGES=6 per pod gives ~18 concurrent renders -- comfortably above the
# caller's process-global 24-slot tool semaphore once web_render is only a
# fraction of tool traffic.
numReplicas: 3
minAvailableReplicas: 2

environment: production

# The shared chart has no ClusterIP-only mode: it always renders either a
# LoadBalancer Service or (its default) a NodePort plus an ALB, and `subdomain`
# supplies the DNS name. Leaving it blank does not disable anything -- it just
# yields an ALB with an empty hostname annotation -- so it is set here.
#
# This stays off the public internet: `loadbalancerIsPublic` defaults to false,
# so the ALB is internal to the VPC. That was the point. The old public
# minwebrender.net was an unauthenticated open renderer -- anyone could make
# SafeGraph infrastructure fetch any URL. Do not point that domain here, and do
# not set loadbalancerIsPublic.
#
# In-cluster callers do not use this hostname or the load balancer at all: they
# resolve the Service directly at http://minwebrender (port 80 -> pod 10000),
# which is what agentic-research sets MIN_WEB_RENDER_BASE_URL to.
subdomain: minwebrender.safegraph.io

# Unlike agentic-research, safe-to-evict is left at the default: renders take
# seconds and 3 replicas absorb a drain, so pinning nodes alive would only
# block cluster-autoscaler for no benefit.

# No serviceAccount role-arn: the renderer touches no AWS APIs -- no S3, no
# RDS, no Secrets Manager. Nothing to grant.

configMap:
  DOMAIN: "minwebrender"
  MAX_PAGES: "6"
  PAGE_TIMEOUT_MS: "45000"
  LOG_LEVEL: "INFO"

# No externalSecrets: the renderer holds no API keys. The Serper and Firecrawl
# fallbacks live in the *caller* (agentic-research), which already has those
# secrets.
