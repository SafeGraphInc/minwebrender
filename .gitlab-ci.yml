# Mirrors the pipeline in safegraph-agentic-research: build -> test -> push to
# ECR, with `latest` published only from the default branch. Harness deploys the
# Helm release from deploy/helm/.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never

stages:
  - build
  - test
  - push

variables:
  SERVICE: minwebrender
  ECR_REPO: $ECR_REGISTRY/$SERVICE
  DOCKER_TLS_CERTDIR: ""
  # An explicit service alias, not GitLab's derived hostname. The old value
  # spelled out what GitLab happens to generate from the image path
  # (public.ecr.aws/w6b6a9x1/docker -> public.ecr.aws-w6b6a9x1-docker), so it
  # was a guess at an implementation detail that silently stops resolving the
  # moment the service fails to start or the derivation changes -- and it did:
  # "dial tcp: lookup public.ecr.aws-w6b6a9x1-docker: no such host".
  DOCKER_HOST: tcp://docker:2375

# Docker 28, not 19.03: the old pin is why this service was stuck on an
# end-of-life base image. Docker 19.03's seccomp profile answers the clone3
# syscall with EPERM instead of ENOSYS, so glibc 2.34+ gives up and no thread
# can start -- which forced the Dockerfile onto Debian 11 (glibc 2.31).
# Debian 11 left LTS on 2026-08-31 and its packages are no longer on
# deb.debian.org, so `playwright install --with-deps` started 404ing on every
# build. clone3 was allowlisted in Docker 20.10.10; staying on 19.03 bought
# nothing and cost the base image.
image: docker:28

build_image:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  services:
    - name: public.ecr.aws/w6b6a9x1/docker:28-dind
      alias: docker
  before_script:
    - apk add --no-cache aws-cli
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker build . -t $ECR_REPO:temporary-$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG
    - docker push $ECR_REPO:temporary-$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG

# Boot the image and render a page end-to-end. This is the test that matters
# here: it catches Chromium/playwright version skew and a browser that fails to
# launch under the container's seccomp profile, neither of which a unit test on
# a ~200-line Flask app would find.
test_image:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  services:
    - name: public.ecr.aws/w6b6a9x1/docker:28-dind
      alias: docker
  before_script:
    - apk add --no-cache aws-cli
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker pull $ECR_REPO:temporary-$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG
    # Probed from INSIDE the container, with no published port. `docker exec`
    # sidesteps cross-container DNS and port publishing entirely, which is
    # worth keeping even now that the dind service has an explicit `docker`
    # alias -- the probe does not care where the daemon lives.
    # python needs no installing: the image is python:3.10-bookworm.
    - docker run -d --name mwr $ECR_REPO:temporary-$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG
    # Chromium launches at import, so readiness is seconds; poll rather than sleep.
    - for i in $(seq 1 30); do docker exec mwr python -c "import urllib.request; urllib.request.urlopen('http://localhost:10000/healthz', timeout=2)" >/dev/null 2>&1 && break || sleep 2; done
    # urlopen raises on any non-2xx, so a 503 from a dead browser fails the job.
    - docker exec mwr python -c "import urllib.request; urllib.request.urlopen('http://localhost:10000/healthz', timeout=5)"
    - docker exec mwr python -c "import urllib.request; urllib.request.urlopen('http://localhost:10000/readyz', timeout=5)"
    # The real test: render a page end-to-end through Chromium.
    - docker exec mwr python -c "import sys, urllib.request; body = urllib.request.urlopen('http://localhost:10000/text/example.com', timeout=90).read().decode(); sys.exit(0 if 'Example Domain' in body else 1)"
  # Always runs, so a failing probe still leaves the container logs in the job
  # output instead of aborting before `docker logs`.
  after_script:
    - docker logs mwr || true
    - docker rm -f mwr || true

push_image:
  stage: push
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  services:
    - name: public.ecr.aws/w6b6a9x1/docker:28-dind
      alias: docker
  before_script:
    - apk add --no-cache aws-cli
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker build . -t $ECR_REPO:permanent-$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG -t $ECR_REPO:latest
    - docker push $ECR_REPO:permanent-$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG
    - docker push $ECR_REPO:latest
